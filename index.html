<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Hiếu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: #e2e8f0;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border: 4px solid #ffffff;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .content {
            padding: 30px;
        }
        .section-title {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 5px;
        }
        .info-grid {
            display: table;
            width: 100%;
            margin-bottom: 20px;
        }
        .info-row {
            display: table-row;
        }
        .info-label, .info-value {
            display: table-cell;
            padding: 10px 0;
            border-bottom: 1px solid #f8fafc;
        }
        .info-label {
            font-weight: 600;
            color: #475569;
            width: 40%;
        }
        .info-value {
            color: #0f172a;
        }
        .footer {
            text-align: center;
            padding: 15px;
            background-color: #f8fafc;
            color: #94a3b8;
            font-size: 12px;
            border-top: 1px solid #f1f5f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">🐶</div>
            <h1>Con Chó Tên Hiếu</h1>
            <p>Hồ Sơ Cá Nhân & Thông Tin</p>
        </div>
        <div class="content">
            <div class="section-title">Thông Tin Cá Nhân</div>
            <div class="info-grid">
                <div class="info-row">
                    <div class="info-label">Tên gọi:</div>
                    <div class="info-value">Hiếu</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Ngày sinh:</div>
                    <div class="info-value">12/08/2005</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Sở thích:</div>
                    <div class="info-value">Đánh quả lọ mồ côi</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Crush:</div>
                    <div class="info-value">My Sỹ</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Học vấn:</div>
                    <div class="info-value">Tốt nghiệp trại giáo dưỡng</div>
                </div>
            </div>
        </div>
        <div class="footer">
            &copy; 2026 Profile Cá Nhân
        </div>
    </div>
</body>
</html>
